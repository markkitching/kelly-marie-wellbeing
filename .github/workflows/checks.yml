# Runs every check on each push and pull request, so a Pages CMS save, a direct push
# or a PR that breaks the calculator, the podcast sync rules or the CMS schema shows a
# red cross on GitHub. It doesn't block the Cloudflare deploy, which runs separately.
name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    # Pinned rather than ubuntu-latest: the browser test installs Chromium through the
    # project's pinned Playwright (1.56.1), which can't install on Ubuntu 26.04. Move this
    # on when Playwright is upgraded to a version that supports the newer image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          npm ci
          pip install pyyaml

      - name: Calculator sums
        run: npm run test:calc

      - name: Podcast sync merge rules
        run: npm run test:sync

      - name: A CMS save can't drop a stored field
        run: python3 scripts/check-pages-yml.py

      - name: CMS titles and descriptions are escaped once
        run: npm run test:titles

      - name: Calculator uses the figures from the editor
        run: npm run test:figures

      - name: Build the site
        run: npm run build

      - name: Calculator page in a browser
        run: |
          npx playwright install --with-deps chromium
          npm run test:page
