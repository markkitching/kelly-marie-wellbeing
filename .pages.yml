# GENERATED FILE — do not edit.
#
# Written by scripts/gen-pages-yml.py from:
#   scripts/base-forms.yml     the site-wide forms, and the media settings
#   scripts/section-forms.yml  the section forms, stamped out per page
#
# Change one of those and run:  python3 scripts/gen-pages-yml.py
# Then check nothing can be lost: python3 scripts/check-pages-yml.py
media:
  input: src/images
  output: /images
content:
  - name: site
    label: Page settings
    type: file
    path: src/content/site.json
    format: json
    fields:
      - name: title
        label: Browser tab title
        type: string
      - name: description
        label: Search-engine description
        type: text
      - name: formspreeEndpoint
        label: Contact form address (Formspree)
        type: string
  - name: header
    label: Header / logo
    type: file
    path: src/content/header.json
    format: json
    fields:
      - name: logoImage
        label: Logo image (optional — overrides the icon below if set)
        type: image
      - name: logoIcon
        label: Logo icon (used only if no logo image is set)
        type: select
        options:
          values:
            - leaf
            - heart
            - star
            - award
            - shield
            - sun
            - moon
            - feather
            - compass
            - home
