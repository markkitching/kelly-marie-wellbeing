        type: string
      - name: ctaLabel
        label: Button text (top right)
        description: Leave empty to remove the button from every page.
        type: string
      - name: ctaIcon
        label: Button icon (top right)
        description: The small symbol on the button.
        type: select
        options:
          values:
            - heart-handshake
            - users
            - megaphone
            - user
            - target
            - infinity
            - presentation
