# The site-wide editor forms, and the media settings.
#
# Generated into .pages.yml by scripts/gen-pages-yml.py, which appends the per-page
# forms it stamps from section-forms.yml. Edit this file, not .pages.yml.
#
# `values: __ICON_VALUES__` is expanded to the one verified list of lucide icon names.
media:
  input: src/images
  output: /images
content:
  - name: site
    label: Page settings
    type: file
    path: src/content/site.json
    format: json
    fields:
      - name: title
        label: Browser tab title
        type: string
      - name: description
        label: Search-engine description
        type: text
      - name: formspreeEndpoint
        label: Contact form address (Formspree)
        type: string
  - name: header
    label: Header / logo
    type: file
    path: src/content/header.json
    format: json
    fields:
      - name: logoImage
        label: Logo image (optional — overrides the icon below if set)
        type: image
      - name: logoIcon
        label: Logo icon (used only if no logo image is set)
        type: select
        options:
          values:
            - leaf
            - heart
            - star
            - award
            - shield
            - sun
            - moon
            - feather
            - compass
            - home
            - anchor
            - activity
            - layers
            - zap
            - globe
      - name: logoLine1
        label: Logo — first line
        type: string
      - name: logoLine2
        label: Logo — second line
        type: string
      - name: ctaLabel
        label: Button text (top right)
        description: Leave empty to remove the button from every page.
        type: string
      - name: ctaIcon
        label: Button icon (top right)
        description: The small symbol on the button.
        type: select
        options:
          values: __ICON_VALUES__
      - name: ctaHref
        label: Button link
        description: Where the button goes. Blank sends it to the enquiry form.
        type: string
  - name: theme
    label: Colours / theme
    type: file
    path: src/content/theme.json
    format: json
    fields:
      - name: palette
        label: Colour scheme
        type: select
        options:
          values:
            - value: navy
              label: Navy & blue
            - value: forest
              label: Forest green
            - value: terracotta
              label: Terracotta & clay
            - value: plum
              label: Plum & heather
            - value: charcoal
              label: Charcoal & gold
      - name: customDark
        label: 'Advanced — main dark colour (hex, leave blank to use the scheme above, e.g. #1c3553)'
        type: string
      - name: customAccent
        label: Advanced — accent colour (hex, optional)
        type: string
      - name: customLight
        label: Advanced — light background colour (hex, optional)
        type: string
      - name: customCream
        label: Advanced — soft tint colour (hex, optional)
        type: string
  - name: menu
    label: Main menu
    type: file
    path: src/content/menu.json
    format: json
    fields:
      - name: items
        label: Links
        description: Drag the rows to change the order links appear in. Untick "Show in menu" to hide one without deleting
          it — the page itself stays online, it just isn't linked. Link names and their destinations are fixed and can't be
          edited here.
        type: object
        list: true
        fields:
          - name: item
            label: Menu link
            type: select
            options:
              values:
                - value: about
                  label: About
                - value: services
                  label: Services
                - value: approach
                  label: My Approach
                - value: wellbeing
                  label: Wellbeing
                - value: counselling
                  label: Counselling
                - value: training-coaching
                  label: Training & Coaching
                - value: podcast
                  label: Podcast
                - value: shop
                  label: Shop
                - value: meet-the-team
                  label: Meet the Team
                - value: contact
                  label: Contact
          - name: visible
            label: Show in menu
            type: boolean
  - name: footer
    label: Footer
    type: file
    path: src/content/footer.json
    format: json
    fields:
      - name: tagline
        label: Tagline
        type: text
      - name: socialLinks
        label: Social links
        description: Shown in the footer. Leave the address empty to hide one.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{platform}'
        fields:
          - name: platform
            label: Platform
            type: select
            options:
              values:
                - linkedin
                - instagram
                - facebook
          - name: href
            label: Address
            description: The full https:// address of the profile.
            type: string
  - name: calculator
    label: Cost calculator
    type: file
    path: src/content/calculator.json
    format: json
    fields:
      - name: eyebrow
        label: Small heading
        type: string
      - name: heading
        label: Heading
        description: Also the title of the shareable page, kellymariewellbeing.com/cost-calculator/
        type: string
      - name: intro
        label: Intro paragraph
        type: text
      - name: shareDescription
        label: Social media preview text
        description: The short description shown under the title when the calculator's link is shared on Facebook, LinkedIn and so on.
        type: text
      - name: staffLabel
        label: Question above the number box
        type: string
      - name: resultLabel
        label: Text above the result
        type: string
      - name: captureHeading
        label: Printable summary — heading
        description: Above the short form people fill in to download a printable (PDF) summary.
        type: string
      - name: captureText
        label: Printable summary — text
        type: text
      - name: sourceNote
        label: Small print (source of the figures)
        description: Keep the line saying this is an estimate based on UK averages.
        type: text
      - name: ctaText
        label: Closing text (above the buttons)
        description: If you mention Deloitte's £4.70 per £1, keep it clear that it's an average across workplace mental health support in general, not a result of our training.
        type: text
      - name: ctaButtonLabel
        label: Button text
        description: Opens the summary form with "talk about training" ticked. Leave empty to remove the button.
        type: string
      - name: presenteeismCost
        label: Advanced — headcount estimate, working while unwell, £ per employee per year
        description: Leave blank to use the default (£793). Update the small print if you change any of these.
        type: number
      - name: turnoverCost
        label: Advanced — headcount estimate, staff leaving, £ per employee per year
        description: Leave blank to use the default (£650).
        type: number
      - name: absenceCost
        label: Advanced — headcount estimate, sickness absence, £ per employee per year
        description: Leave blank to use the default (£243).
        type: number
      - name: daysPerAbsence
        label: Advanced — starting assumption, working days lost per absence
        description: Visitors can change this on the page. Leave blank to use the default (23, rounded from HSE's 2024/25 average of 22.9 days per case).
        type: number
      - name: replacementPct
        label: Advanced — starting assumption, cost of replacing a leaver (% of salary)
        description: Leave blank to use the default (30).
        type: number
      - name: productivityLossPct
        label: Advanced — starting assumption, productivity lost per struggling employee (%)
        description: Leave blank to use the default (20).
        type: number
      - name: onCostPct
        label: Advanced — starting assumption, employer on-costs (%)
        description: Leave blank to use the default (15).
        type: number
  - name: shop
    label: 'Page: Shop'
    type: file
    path: src/content/shop.json
    format: json
    fields:
      - name: published
        label: Published
        description: Leave off while the page is being prepared. Off, the page is only reachable by its link, search engines are asked not to list it, and it can't appear in the menu. Switch on to go live, then tick "Show in menu" for Shop under Main menu.
        type: boolean
      - name: eyebrow
        label: Small heading
        type: string
      - name: heading
        label: Page heading
        type: string
      - name: intro
        label: Intro paragraph
        type: text
      - name: image1
        label: Image 1 (next to the range list)
        type: image
      - name: image1Alt
        label: Image 1 description
        description: Read aloud to people using screen readers. Describe what the photo shows.
        type: string
      - name: rangeTitle
        label: Range list heading
        type: string
      - name: rangeItems
        label: Range list
        description: Each row is one ticked line. Drag to reorder.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{text}'
        fields:
          - name: text
            label: Text
            type: string
      - name: image2
        label: Image 2 (next to the ordering box)
        type: image
      - name: image2Alt
        label: Image 2 description
        type: string
      - name: orderHeading
        label: Ordering box heading
        type: string
      - name: packsIntro
        label: Packs intro
        description: Shown above the packs, e.g. "Pay securely by card. You can add your own support contacts at checkout." Only appears when there are packs.
        type: text
      - name: packs
        label: Packs for sale
        description: Each pack gets its own button. Leave the list empty to show just the enquiry text and button. A pack's Buy button only works once it has a Stripe link AND the business address below is filled in; until then it goes to the enquiry link.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{name}'
        fields:
          - name: name
            label: Pack name
            type: string
          - name: description
            label: What's in it
            type: string
          - name: price
            label: Price
            description: Shown exactly as typed, e.g. "£25" or "£25 inc. postage". Make sure it matches the price in Stripe.
            type: string
          - name: buyLink
            label: Stripe payment link
            description: From Stripe > Payment Links, starting https://buy.stripe.com/. Leave blank until the pack is ready to sell.
            type: string
      - name: buyLabel
        label: Buy button text
        description: Used on every pack that's on sale. Blank shows "Buy now".
        type: string
      - name: sellerAddress
        label: Business address
        description: UK law requires a postal address to be shown when selling online. Shown on the Terms of sale page. No pack can be bought until this is filled in.
        type: string
      - name: orderText
        label: Enquiry text
        description: With packs, shown underneath them (e.g. "Need more copies or something different? Get in touch."). Without packs, it's the main ordering text.
        type: text
      - name: buttonLabel
        label: Enquiry button text
        description: Leave empty to remove the enquiry button.
        type: string
      - name: buttonLink
        label: Enquiry button link
        description: Where the enquiry button goes. Blank sends it to the contact page.
        type: string
      - name: brandedHeading
        label: Branded version heading
        type: string
      - name: brandedText
        label: Branded version text
        type: text
      - name: image3
        label: Image 3 (next to the branded version)
        type: image
      - name: image3Alt
        label: Image 3 description
        type: string
      - name: faqsTitle
        label: Questions heading
        type: string
      - name: faqs
        label: Questions
        description: Shown as an accordion. Drag to reorder.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{question}'
        fields:
          - name: question
            label: Question
            type: string
          - name: answer
            label: Answer
            type: text
          - name: linkLabel
            label: Link text (optional)
            description: A link shown after the answer, e.g. "Find out about our training".
            type: string
          - name: linkHref
            label: Link address (optional)
            type: string
