# The site-wide editor forms, and the media settings.
#
# Generated into .pages.yml by scripts/gen-pages-yml.py, which appends the per-page
# forms it stamps from section-forms.yml. Edit this file, not .pages.yml.
#
# `values: __ICON_VALUES__` is expanded to the one verified list of lucide icon names.
media:
  input: src/images
  output: /images
content:
  - name: site
    label: Page settings
    type: file
    path: src/content/site.json
    format: json
    fields:
      - name: title
        label: Browser tab title
        type: string
      - name: description
        label: Search-engine description
        type: text
      - name: formspreeEndpoint
        label: Contact form address (Formspree)
        type: string
  - name: header
    label: Header / logo
    type: file
    path: src/content/header.json
    format: json
    fields:
      - name: logoImage
        label: Logo image (optional — overrides the icon below if set)
        type: image
      - name: logoIcon
        label: Logo icon (used only if no logo image is set)
        type: select
        options:
          values:
            - leaf
            - heart
            - star
            - award
            - shield
            - sun
            - moon
            - feather
            - compass
            - home
            - anchor
            - activity
            - layers
            - zap
            - globe
      - name: logoLine1
        label: Logo — first line
        type: string
      - name: logoLine2
        label: Logo — second line
        type: string
      - name: ctaLabel
        label: Button text (top right)
        description: Leave empty to remove the button from every page.
        type: string
      - name: ctaIcon
        label: Button icon (top right)
        description: The small symbol on the button.
        type: select
        options:
          values: __ICON_VALUES__
      - name: ctaHref
        label: Button link
        description: Where the button goes. Blank sends it to the enquiry form.
        type: string
  - name: theme
    label: Colours / theme
    type: file
    path: src/content/theme.json
    format: json
    fields:
      - name: palette
        label: Colour scheme
        type: select
        options:
          values:
            - value: navy
              label: Navy & blue
            - value: forest
              label: Forest green
            - value: terracotta
              label: Terracotta & clay
            - value: plum
              label: Plum & heather
            - value: charcoal
              label: Charcoal & gold
      - name: customDark
        label: 'Advanced — main dark colour (hex, leave blank to use the scheme above, e.g. #1c3553)'
        type: string
      - name: customAccent
        label: Advanced — accent colour (hex, optional)
        type: string
      - name: customLight
        label: Advanced — light background colour (hex, optional)
        type: string
      - name: customCream
        label: Advanced — soft tint colour (hex, optional)
        type: string
  - name: menu
    label: Main menu
    type: file
    path: src/content/menu.json
    format: json
    fields:
      - name: items
        label: Links
        description: Drag the rows to change the order links appear in. Untick "Show in menu" to hide one without deleting
          it — the page itself stays online, it just isn't linked. Link names and their destinations are fixed and can't be
          edited here.
        type: object
        list: true
        fields:
          - name: item
            label: Menu link
            type: select
            options:
              values:
                - value: about
                  label: About
                - value: services
                  label: Services
                - value: approach
                  label: My Approach
                - value: wellbeing
                  label: Wellbeing
                - value: counselling
                  label: Counselling
                - value: training-coaching
                  label: Training & Coaching
                - value: podcast
                  label: Podcast
                - value: shop
                  label: Shop
                - value: meet-the-team
                  label: Meet the Team
                - value: contact
                  label: Contact
          - name: visible
            label: Show in menu
            type: boolean
  - name: footer
    label: Footer
    type: file
    path: src/content/footer.json
    format: json
    fields:
      - name: tagline
        label: Tagline
        type: text
      - name: socialLinks
        label: Social links
        description: Shown in the footer. Leave the address empty to hide one.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{platform}'
        fields:
          - name: platform
            label: Platform
            type: select
            options:
              values:
                - linkedin
                - instagram
                - facebook
          - name: href
            label: Address
            description: The full https:// address of the profile.
            type: string
  - name: calculator
    label: Cost calculator
    type: file
    path: src/content/calculator.json
    format: json
    fields:
      - name: eyebrow
        label: Small heading
        type: string
      - name: heading
        label: Heading
        description: Also the title of the shareable page, kellymariewellbeing.com/cost-calculator/
        type: string
      - name: intro
        label: Intro paragraph
        type: text
      - name: shareDescription
        label: Social media preview text
        description: The short description shown under the title when the calculator's link is shared on Facebook, LinkedIn and so on.
        type: text
      - name: staffLabel
        label: Question above the number box
        type: string
      - name: resultLabel
        label: Text above the result
        type: string
      - name: captureHeading
        label: Printable summary — heading
        description: Above the short form people fill in to download a printable (PDF) summary.
        type: string
      - name: captureText
        label: Printable summary — text
        type: text
      - name: sourceNote
        label: Small print (source of the figures)
        description: Keep the line saying this is an estimate based on UK averages.
        type: text
      - name: ctaText
        label: Closing text (above the buttons)
        description: If you mention Deloitte's £4.70 per £1, keep it clear that it's an average across workplace mental health support in general, not a result of our training.
        type: text
      - name: ctaButtonLabel
        label: Button text
        description: Opens the summary form with "talk about training" ticked. Leave empty to remove the button.
        type: string
      - name: presenteeismCost
        label: Advanced — headcount estimate, working while unwell, £ per employee per year
        description: Leave blank to use the default (£793). Update the small print if you change any of these.
        type: number
      - name: turnoverCost
        label: Advanced — headcount estimate, staff leaving, £ per employee per year
        description: Leave blank to use the default (£650).
        type: number
      - name: absenceCost
        label: Advanced — headcount estimate, sickness absence, £ per employee per year
        description: Leave blank to use the default (£243).
        type: number
      - name: daysPerAbsence
        label: Advanced — starting assumption, working days lost per absence
        description: Visitors can change this on the page. Leave blank to use the default (23, rounded from HSE's 2024/25 average of 22.9 days per case).
        type: number
      - name: replacementPct
        label: Advanced — starting assumption, cost of replacing a leaver (% of salary)
        description: Leave blank to use the default (30).
        type: number
      - name: productivityLossPct
        label: Advanced — starting assumption, productivity lost per struggling employee (%)
        description: Leave blank to use the default (20).
        type: number
      - name: onCostPct
        label: Advanced — starting assumption, employer on-costs (%)
        description: Leave blank to use the default (15).
        type: number
  - name: shop
    label: 'Page: Shop'
    type: file
    path: src/content/shop.json
    format: json
    fields:
      - name: published
        label: Published
        description: Leave off while the page is being prepared. Off, the page is only reachable by its link, search engines are asked not to list it, and it can't appear in the menu. Switch on to go live, then tick "Show in menu" for Shop under Main menu.
        type: boolean
      - name: eyebrow
        label: Small heading
        type: string
      - name: heading
        label: Page heading
        type: string
      - name: intro
        label: Intro paragraph
        type: text
      - name: image1
        label: Image 1 (next to the range list)
        type: image
      - name: image1Alt
        label: Image 1 description
        description: Read aloud to people using screen readers. Describe what the photo shows.
        type: string
      - name: rangeTitle
        label: Range list heading
        type: string
      - name: rangeItems
        label: Range list
        description: Each row is one ticked line. Drag to reorder.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{text}'
        fields:
          - name: text
            label: Text
            type: string
      - name: pricingHeading
        label: Pricing heading
        type: string
      - name: packs
        label: Pricing packs
        description: One card each, in this order on a computer (the highlighted pack moves to the top on phones). Remove every pack to hide the pricing section.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{name}'
        fields:
          - name: name
            label: Pack name
            type: string
          - name: sets
            label: Sets
            description: Copies of each sheet in the pack.
            type: number
          - name: sheets
            label: Total sheets
            description: Best left blank, so it is worked out from the sets (sets × sheets in a set) and stays right if they change.
            type: number
          - name: price
            label: Price (£)
            description: Numbers only, e.g. 149.
            type: number
          - name: perSet
            label: Price per set (£)
            description: Best left blank, so it is worked out from the price and sets and stays right if the price changes.
            type: number
          - name: extra
            label: Extra line
            description: Optional line under the price, e.g. "Double the Medium pack for £70 more." This is typed text, so update it if the prices change.
            type: string
          - name: button
            label: Button text
            description: The button goes to the contact page. Blank shows "Enquire about" and the pack name.
            type: string
          - name: highlight
            label: Highlight as best value
            description: Gives this card a stronger border, the label below, and puts it first on phones. Tick one pack only.
            type: boolean
      - name: setsText
        label: Sets line
        description: Shown under each pack name. {sets} is replaced with the pack's number of sets.
        type: string
      - name: packDetailText
        label: Pack detail line
        description: '{sets} and {sheets} are replaced with each pack''s figures.'
        type: string
      - name: perSetText
        label: Price per set line
        description: '{perSet} is replaced with each pack''s price per set, e.g. £9.93.'
        type: string
      - name: vatLabel
        label: VAT label
        description: Leave blank, or e.g. "+ VAT" to show it after every price.
        type: string
      - name: bestValueLabel
        label: Highlight label
        description: The small label on the highlighted pack, e.g. "Best value".
        type: string
      - name: pricingFootnote
        label: Line under the packs
        description: '{quickTips} and {understanding} are replaced with the sheet series names below.'
        type: text
      - name: sheetsPerSet
        label: Sheets in a set
        description: Used to work out total sheets. Currently 15.
        type: number
      - name: seriesUnderstanding
        label: Series name (Understanding guides)
        type: string
      - name: seriesQuickTips
        label: Series name (Quick Tips sheets)
        type: string
      - name: image2
        label: Image 2 (next to the ordering box)
        type: image
      - name: image2Alt
        label: Image 2 description
        type: string
      - name: orderHeading
        label: Ordering box heading
        type: string
      - name: orderText
        label: Ordering box text
        type: text
      - name: buttonLabel
        label: Order button text
        description: The page's only button. Leave empty to remove it.
        type: string
      - name: buttonLink
        label: Order button link
        description: Where the button goes. Blank sends it to the contact page. Change this when online ordering is ready.
        type: string
      - name: brandedHeading
        label: Branded version heading
        type: string
      - name: brandedText
        label: Branded version text
        type: text
      - name: image3
        label: Image 3 (next to the branded version)
        type: image
      - name: image3Alt
        label: Image 3 description
        type: string
      - name: showFaqs
        label: Show questions section
        description: Off hides the questions section from the page. The questions below are kept either way.
        type: boolean
      - name: faqsTitle
        label: Questions heading
        type: string
      - name: faqs
        label: Questions
        description: Shown as an accordion. Drag to reorder.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{question}'
        fields:
          - name: question
            label: Question
            type: string
          - name: answer
            label: Answer
            type: text
          - name: linkLabel
            label: Link text (optional)
            description: A link shown after the answer, e.g. "Find out about our training".
            type: string
          - name: linkHref
            label: Link address (optional)
            type: string
