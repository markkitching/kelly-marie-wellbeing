# The editor forms for the seven sections a page can be built from.
#
# Kept here rather than in .pages.yml because more than one page uses them and not every
# page uses all of them: scripts/gen-pages-yml.py stamps out a copy per page that shows
# a section, re-pointing name, label and path. Edit a field once here and every page's
# form gets it.
#
# This file is not read by the site or by Pages CMS — only by the generator.
sections:
  - name: hero
    label: Top section (hero)
    type: file
    path: src/content/hero.json
    format: json
    fields:
      - name: eyebrow
        label: Small heading above title
        type: string
      - name: headingLead
        label: Main heading — first line
        type: string
      - name: headingEmphasis
        label: Main heading — italic second line
        type: string
      - name: paragraph1
        label: Intro paragraph 1
        type: text
      - name: paragraph2
        label: Intro paragraph 2
        type: text
      - name: primaryButton
        label: Main button text
        type: string
      - name: primaryButtonIcon
        label: Main button icon
        description: The small symbol on the button.
        type: select
        options:
          values: __ICON_VALUES__
      - name: secondaryButton
        label: Secondary button text
        type: string
      - name: calculatorButton
        label: Cost calculator button text
        description: A button to the cost calculator. Leave empty to remove it.
        type: string
      - name: image
        label: Hero photo
        type: image
      - name: imageAlt
        label: Hero photo description
        description: Read aloud to people using screen readers. Describe what the photo shows, e.g. "Two people talking at a desk".
        type: string
  - name: about
    label: About Kelly
    type: file
    path: src/content/about.json
    format: json
    fields:
      - name: eyebrow
        label: Small heading
        type: string
      - name: headingLead
        label: Heading — first part
        type: string
      - name: headingEmphasis
        label: Heading — italic part
        type: string
      - name: paragraph1
        label: Paragraph 1
        type: text
      - name: paragraph2
        label: Paragraph 2
        type: text
      - name: paragraph3
        label: Paragraph 3
        type: text
      - name: image
        label: About photo
        type: image
      - name: badges
        label: Credential badges
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{label}'
        fields:
          - name: icon
            label: Icon
            type: select
            options:
              values:
                - award
                - map-pin
                - clock
                - shield
                - heart
                - star
                - check
                - check-circle
                - user
                - users
                - brain
                - layers
                - leaf
                - feather
                - sun
                - moon
                - briefcase
                - monitor
                - book
                - clipboard
                - calendar
                - mail
                - phone
                - message-circle
                - globe
                - home
                - activity
                - compass
                - coffee
                - headphones
                - tag
                - target
                - thumbs-up
                - trending-up
                - zap
          - name: label
            label: Text
            type: string
  - name: services
    label: Enquiry form — service options
    type: file
    path: src/content/services.json
    format: json
    fields:
      - name: eyebrow
        label: Small heading
        type: string
      - name: heading
        label: Section heading
        type: string
      - name: intro
        label: Intro text
        type: text
      - name: cards
        label: Service cards
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{title}'
        fields:
          - name: icon
            label: Icon
            description: Not shown on the site at the moment.
            type: select
            options:
              values:
                - award
                - map-pin
                - clock
                - shield
                - heart
                - star
                - check
                - check-circle
                - user
                - users
                - brain
                - layers
                - leaf
                - feather
                - sun
                - moon
                - briefcase
