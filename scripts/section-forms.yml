                - calendar
                - mail
                - phone
                - message-circle
                - globe
                - home
                - activity
                - compass
                - coffee
                - headphones
                - tag
                - target
                - thumbs-up
                - trending-up
                - zap
          - name: title
            label: Title
            type: string
          - name: description
            label: Description
            type: text
          - name: meta
            label: Footer line (duration / format)
            type: string
  - name: workplace
